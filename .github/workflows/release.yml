name: Release NordicKeyboard

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version, e.g. 0.2.0"
        required: true
        type: string
      version_code:
        description: "Increasing Android version code, e.g. 2"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
            echo "code=$((10#${TAG//./}))" >> "$GITHUB_OUTPUT"
          fi
      - name: Patch Gradle version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('versionCode = 1', f'versionCode = {os.environ["VERSION_CODE"]}')
          s = s.replace('versionName = "0.1.0"', f'versionName = "{os.environ["VERSION_NAME"]}"')
          p.write_text(s)
          PY
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
      - name: Build release APK
        run: gradle assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NordicKeyboard.apk
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: NordicKeyboard v${{ steps.version.outputs.name }}
          files: NordicKeyboard.apk

      - name: Publish update metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("update/update.json")
          p.write_text(json.dumps({
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": "https://github.com/atdenaiforeve/NordicKeyboard/releases/latest/download/NordicKeyboard.apk"
          }, indent=2) + "\n")
          PY
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Commit update metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/update.json
          git commit -m "Publish NordicKeyboard update metadata" || exit 0
          git push
